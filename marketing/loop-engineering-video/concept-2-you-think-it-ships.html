<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Think, It Ships</title>
<link rel="stylesheet" href="shared.css">
<style>
  #world { transform-origin: 0 0; }
  .idea { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 10px rgba(91,75,255,.12), 0 0 60px 10px rgba(91,75,255,.45); }
  .halo { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--accent); }
  .rail { height: 4px; background: repeating-linear-gradient(90deg, var(--line) 0 18px, transparent 18px 34px); }
  .slabel { font-size: 150px; font-weight: 800; letter-spacing: -0.04em; color: var(--muted); white-space: nowrap; }
  .okb { width: 120px; height: 120px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(18,161,80,.35); }
  .okb svg { width: 70px; height: 70px; }
  .tally { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; display: flex; align-items: center; gap: 18px; }
  .cap.xs { font-size: 40px; }
  .tally .n { font-family: var(--mono); color: var(--ok); font-size: 56px; min-width: 70px; }
  .e2 { font-size: 112px; }
  .cap.big { font-size: 96px; }
</style>
</head>
<body>
<div id="stage">
  <div id="world" class="layer"></div>
  <div id="screen" class="layer"></div>
</div>
<script src="shared.js"></script>
<script>
const { clamp, prog, lerp, E, kf, env, S, add, caption, showCap, phone, phoneState, ticket, ticketStatus, ring, ringState, logo, ICON } = M;
const world = document.getElementById('world'), screen = document.getElementById('screen');

const SX = [960, 2460, 3960, 5460, 6960], Y = 470, CY = 900;

const rail = add(world, '<div class="rail" style="width:6000px"></div>');
const labels = ['Idea', 'Say it', 'Ticket', 'Loop', 'Done'].map(l => add(world, `<div class="slabel">${l}</div>`));

// station 0: the idea
const chip = add(world, '<div class="chip"><span class="dot"></span>On a walk<span class="t">· 7:42am</span></div>');
const halo = add(world, '<div class="halo"></div>');
// station 1 & 4: phones
const ph1 = phone(world), ph2 = phone(world);
// station 3: loop
const rg = ring(world, 360);
const rLabel = add(world, '<div class="ring-label"><b>1 loop</b><span>checks every 10 min</span></div>');
// the ticket
const ghost = ticket(world, 'CTX-···', 'Next idea');
const tk = ticket(world, 'CTX-318', 'Shorter onboarding emails');
// montage dots + check bubbles
const N = 22;
const DOTS = Array.from({ length: N }, () => add(world, '<div class="idea"></div>'));
const OKS = Array.from({ length: N }, () => add(world, `<div class="okb">${ICON.checkW}</div>`));
const idea = add(world, '<div class="idea"></div>');

const caps = [
  caption(world, 'An idea hits.', 'big'),
  caption(world, 'Say it.', 'big'),
  caption(world, 'It becomes a ticket.', 'big'),
  caption(world, 'Your loop picks it up.', 'big'),
  caption(world, 'You hear back when it’s *done.*', 'big'),
];
const sub3 = caption(world, 'while you get on with your day', 'xs');

const capAll = caption(screen, 'Every idea. *All day.*', 'big');
const tally = add(screen, `<div class="tally"><div class="okb" style="width:60px;height:60px">${ICON.checkW}</div>Shipped today <span class="n">0</span></div>`);
const tallyN = tally.querySelector('.n');

const end1 = caption(screen, 'You think. *It ships.*', 'e2');
const end2 = caption(screen, 'Be the orchestrator, not the code junkie.', 'xs');
const lg = logo(screen);
const url = add(screen, '<div class="url">contextli.com/<b>loop-engineering</b></div>');

const MSTART = 18.7, MGAP = 0.1, MDUR = 1.9;

function render(t) {
  // ---- camera ----
  const camX = kf(t, [[0, SX[0]], [2.6, SX[0]], [3.4, SX[1]], [6.4, SX[1]], [7.2, SX[2]], [9.6, SX[2]], [10.4, SX[3]], [14.0, SX[3]], [14.8, SX[4]], [17.3, SX[4]], [18.6, SX[2]]]);
  const z = kf(t, [[14.8, 1], [15.7, 1.12], [17.3, 1.12], [18.6, 0.255]]);
  const camY = 540;
  const worldFade = 1 - E.inOut(prog(t, 22.7, 23.3));
  world.style.transform = `translate(960px,540px) scale(${z}) translate(${-camX}px,${-camY}px)`;
  world.style.opacity = worldFade;

  const zoomed = prog(t, 17.6, 18.5);
  S(rail, { x: SX[2], y: Y, o: 0.25 + 0.75 * zoomed });
  labels.forEach((l, i) => S(l, { x: SX[i], y: 1010, o: E.out(prog(t, 18.3 + i * 0.08, 18.8 + i * 0.08)) }));

  // ---- station 0: idea ----
  const ideaIn = E.back(prog(t, 0.2, 0.7));
  let ix = SX[0], iy = Y, is = ideaIn, io = clamp(ideaIn * 2);
  const fly = E.inOut(prog(t, 2.55, 3.4));
  if (t > 2.55) { ix = lerp(SX[0], SX[1], fly); iy = lerp(Y, Y + 210, fly) - Math.sin(fly * Math.PI) * 220; }
  if (t > 3.4) { is = 1 - E.in(prog(t, 3.4, 3.6)); }
  is *= 1 + 0.08 * Math.sin(t * 5);
  S(idea, { x: ix, y: iy, s: is * 1.4, o: t > 3.6 ? 0 : io });
  const hp = (t * 0.9) % 1;
  S(halo, { x: SX[0], y: Y, s: 1.4 + hp * 2.4, o: t < 2.6 ? (1 - hp) * 0.7 * io : 0 });
  S(chip, { x: SX[0], y: Y - 150 + (1 - E.out(prog(t, 0.6, 1.1))) * 20, s: 1.3, o: env(t, 0.6, 2.7, 0.4, 0.3) });

  // ---- station 1: speak ----
  S(ph1, { x: SX[1], y: Y, s: 0.82 });
  phoneState(ph1, t, { time: '7:42', text: 'Make the onboarding emails shorter. Three lines max.', tp: prog(t, 3.6, 5.4), amp: env(t, 3.5, 5.5, 0.2, 0.3), tag: prog(t, 5.5, 5.85) * (1 - prog(t, 6.5, 6.7)) });

  // ---- ticket ----
  const tOut = E.inOut(prog(t, 6.4, 7.2)), tIn = E.inOut(prog(t, 9.6, 10.4)), tDone = E.inOut(prog(t, 14.0, 14.75));
  let tx = lerp(SX[1], SX[2], tOut), ty = lerp(Y - 40, Y, tOut) - Math.sin(tOut * Math.PI) * 160, ts = lerp(0.5, 1.5, tOut);
  if (t > 9.6) { tx = lerp(SX[2], SX[3], tIn); ty = Y; ts = lerp(1.5, 0.72, tIn); }
  if (t > 10.4 && t < 14.0) ty = Y + Math.sin((t - 10.4) * 3) * 5;
  if (t > 14.0) { tx = lerp(SX[3], SX[4], tDone); ty = lerp(Y, Y - 250, tDone) - Math.sin(tDone * Math.PI) * 120; ts = lerp(0.72, 0.45, tDone); }
  ticketStatus(tk, t > 13.5 ? 'done' : t > 10.5 ? 'working' : 'queued');
  S(tk, { x: tx, y: ty, s: ts, o: clamp(prog(t, 6.4, 6.55) * 3) * (1 - prog(t, 14.55, 14.8)) });

  S(ghost, { x: SX[2], y: Y, s: 1.5, o: zoomed * worldFade });

  // ---- station 3: loop ----
  const working = t > 10.6 && t < 13.5;
  ringState(rg, t * 120 + E.inOut(prog(t, 10.6, 13.5)) * 360, t < 14.3 ? E.inOut(prog(t, 10.8, 13.4)) : 0);
  S(rg, { x: SX[3], y: Y, s: 1.3 });
  S(rLabel, { x: SX[3], y: Y + 300, o: 1 - zoomed });

  // ---- station 4: done ----
  S(ph2, { x: SX[4], y: Y, s: 0.82 });
  phoneState(ph2, t, { time: '10:05', notifs: [[prog(t, 14.65, 15.1), 'Done: Shorter onboarding emails', 'PR ready · 3 templates updated.']] });

  // ---- world captions ----
  const capWin = [[0.5, 2.7], [3.35, 6.5], [7.15, 9.7], [10.35, 14.1], [14.75, 17.4]];
  caps.forEach((c, i) => showCap(c, t, capWin[i][0], capWin[i][1], SX[i], CY + 20));
  showCap(sub3, t, 11.0, 14.1, SX[3], CY + 110, { stagger: 0.04 });

  // ---- montage: every idea flows through the pipeline ----
  let shipped = t > 15 ? 1 : 0;
  DOTS.forEach((d, i) => {
    const a = MSTART + i * MGAP, u = prog(t, a, a + MDUR);
    const seg = Math.min(3.999, u * 4), k = Math.floor(seg), f = E.inOut(seg - k);
    const x = lerp(SX[k], SX[k + 1], f), y = Y - Math.sin(f * Math.PI) * 140;
    S(d, { x, y, s: 2.2, o: t > a && u < 1 ? clamp((t - a) * 6) * (1 - prog(u, 0.97, 1)) : 0 });
    const ok = OKS[i], op = prog(t, a + MDUR, a + MDUR + 0.9);
    S(ok, { x: SX[4] + Math.sin(i * 2.4) * 120, y: Y - 380 - E.out(op) * 520, s: 0.6 + 0.6 * E.back(clamp(op * 3)), o: op > 0 && op < 1 ? 1 - E.in(op) : 0 });
    if (t > a + MDUR) shipped++;
  });

  // ---- screen-level ----
  showCap(capAll, t, 18.8, 22.9, 960, 210);
  S(tally, { x: 960, y: 880, o: env(t, 19.1, 22.9, 0.4, 0.3) });
  tallyN.textContent = shipped;

  showCap(end1, t, 23.2, 30, 960, 430, { stagger: 0.14, dy: 60 });
  showCap(end2, t, 24.4, 30, 960, 560, { stagger: 0.04 });
  const lgIn = E.outQuint(prog(t, 25.2, 25.9));
  S(lg, { x: 960, y: 750 + (1 - lgIn) * 30, o: lgIn });
  S(url, { x: 960, y: 840 + (1 - lgIn) * 30, o: E.outQuint(prog(t, 25.5, 26.1)) });
}
M.play({ duration: 28.5, render });
</script>
</body>
</html>
