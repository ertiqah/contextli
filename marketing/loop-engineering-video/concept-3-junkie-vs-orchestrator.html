<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junkie vs Orchestrator</title>
<link rel="stylesheet" href="shared.css">
<style>
  #darkp { background: var(--night); width: 960px; height: 1080px; transform-origin: left center; }
  .side { font-family: var(--serif); font-size: 72px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
  .side.l { color: #fff; }
  .side small { display: block; font-family: var(--sans); font-size: 26px; font-weight: 500; letter-spacing: -0.01em; color: var(--muted); margin-top: 6px; text-align: center; }
  .clock { font-family: var(--mono); font-weight: 700; font-size: 34px; padding: 12px 26px; border-radius: 999px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.18); white-space: nowrap; }
  .mt { width: 250px; height: 140px; border-radius: 12px; background: var(--term); border: 2px solid var(--term-line); font-family: var(--mono); font-size: 13px; color: var(--term-text); overflow: hidden; }
  .mt .bar { height: 24px; background: var(--term-bar); display: flex; gap: 6px; align-items: center; padding: 0 10px; }
  .mt .bar i { width: 8px; height: 8px; border-radius: 50%; background: #3A3A46; display: block; }
  .mt .bar span { color: var(--term-dim); font-size: 11px; margin-left: 6px; }
  .mt .b { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; white-space: nowrap; }
  .mt .s { color: var(--claude); }
  .mt.flash { border-color: var(--warn); box-shadow: 0 0 0 4px rgba(250,202,75,.18); }
  .mt.flash .s { color: var(--warn); }
  .tal { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .tal .lbl { font-family: var(--serif); font-size: 34px; font-weight: 500; letter-spacing: -0.01em; width: 130px; }
  .tal .lbl.l { color: #fff; }
  .chk { width: 44px; height: 44px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; }
  .chk svg { width: 26px; height: 26px; }
  .meta { font-family: var(--mono); font-size: 22px; color: var(--muted); white-space: nowrap; }
  .meta b { color: var(--ink); }
  .meta.l b { color: #fff; }
  .mini { width: 150px; padding: 10px 12px; border-radius: 12px; background: #fff; border: 1px solid var(--line); box-shadow: 0 8px 20px rgba(0,0,0,.08); font-weight: 700; font-size: 15px; }
  .mini i { display: block; height: 7px; border-radius: 4px; background: var(--chip-bg); margin-top: 8px; font-style: normal; }
  .mini em { font-style: normal; color: var(--claude); font-size: 13px; }
  .e2 { font-size: 124px; }
</style>
</head>
<body>
<div id="stage">
  <div id="darkp" class="abs"></div>
  <div id="L" class="layer"></div>
  <div id="R" class="layer"></div>
  <div id="top" class="layer"></div>
</div>
<script src="shared.js"></script>
<script>
const { clamp, prog, lerp, E, kf, env, S, add, caption, showCap, phone, phoneState, ring, ringState, logo, ICON } = M;
const darkp = document.getElementById('darkp'), L = document.getElementById('L'), R = document.getElementById('R'), top_ = document.getElementById('top');

const DAY0 = 3.0, DAY1 = 16.0;
const clockAt = t => { const h = 9 + 9 * prog(t, DAY0, DAY1), hh = Math.floor(h), mm = Math.floor((h - hh) * 60 / 5) * 5;
  return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')}${hh >= 12 ? 'pm' : 'am'}`; };

// ---------- intro ----------
const intro = caption(top_, 'Same Claude. *Same day.*');

// ---------- left: code junkie ----------
const hL = add(L, '<div class="side l">Code junkie<small>10 terminals, babysat</small></div>');
const NAMES = ['api', 'web', 'billing', 'mobile', 'search', 'docs', 'infra', 'admin', 'emails', 'onboarding'];
const TASKS = ['refactor auth', 'sticky navbar', 'stripe retries', 'iOS keyboard', 'fuzzy search', 'API docs', 'node 22', 'CSV export', 'unsubscribe', 'welcome flow'];
const GRID = [];
for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) GRID.push([190 + c * 290, 300 + r * 165]);
GRID.splice(10);
const tiles = NAMES.map((n, i) => {
  const el = add(L, `<div class="mt"><div class="bar"><i></i><i></i><i></i><span>claude — ${n}</span></div><div class="b"><div style="color:var(--term-dim)">› ${TASKS[i]}</div><div>● working…</div><div class="s"></div></div></div>`);
  el._s = el.querySelector('.s'); return el;
});
const cur = add(L, `<div class="cursor">${ICON.cursor}</div>`);
const talL = add(L, '<div class="tal"><span class="lbl l">Shipped</span></div>');
const metaL = add(L, '<div class="meta l">terminals open: <b>10</b> · switches: <b>0</b></div>'); const swN = metaL.querySelectorAll('b')[1];
const SHIP_L = [8.2, 12.6, 15.6];

// ---------- right: orchestrator ----------
const hR = add(R, '<div class="side">Orchestrator<small>1 loop, from your phone</small></div>');
const ph = phone(R);
const rg = ring(R, 360);
const rLab = add(R, '<div class="ring-label"><b>1 loop</b></div>');
const LIFE = ['On a walk', 'Strategy call', 'Lunch with a customer', 'At the gym', 'Kid’s soccer game'];
const LIFE_T = [3.2, 5.8, 8.4, 11.0, 13.6];
const chips = LIFE.map(l => add(R, `<div class="chip"><span class="dot"></span>${l}</div>`));
const VOICE = []; LIFE_T.forEach(a => { VOICE.push(a + 0.4, a + 1.5); });
const minis = VOICE.map(() => add(R, '<div class="mini"><em>#claude</em><i></i><i style="width:70%"></i></div>'));
const talR = add(R, '<div class="tal"><span class="lbl">Shipped</span></div>');
const metaR = add(R, '<div class="meta">terminals open: <b>1</b></div>');
const SHIP_R = VOICE.map(v => v + 1.9);

function checks(row, n) { return Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'chk'; c.innerHTML = ICON.checkW; row.appendChild(c); return c; }); }
const chkL = checks(talL, SHIP_L.length), chkR = checks(talR, SHIP_R.length);

const clock = add(top_, '<div class="clock">9:00am</div>');
const PHX = 1220, PHY = 540, RX = 1690, RY = 500;

// ---------- end ----------
const e2 = caption(top_, 'Stop typing. / Start _orchestrating._', 'e2');
const lg = logo(top_);
const url = add(top_, '<div class="url">Set it up in 20 minutes · contextli.com/<b>loop-engineering</b></div>');

function render(t) {
  showCap(intro, t, 0.2, 2.35, 960, 540, { stagger: 0.12 });

  const split = E.inOut(prog(t, 2.3, 3.0)), collapse = E.inOut(prog(t, 17.6, 18.4));
  darkp.style.transform = `scaleX(${split * (1 - collapse)})`;
  const lo = clamp(prog(t, 2.7, 3.2) * (1 - prog(t, 17.4, 17.8)));
  const ro = clamp(prog(t, 2.7, 3.2) * (1 - prog(t, 17.5, 18.0)));
  L.style.opacity = lo; R.style.opacity = ro;
  L.style.transform = `translateX(${-collapse * 300}px)`;

  // clock
  S(clock, { x: 960, y: 100, s: 1 + (t > DAY1 && t < 17.4 ? 0.06 * Math.sin((t - DAY1) * 8) : 0), o: env(t, 2.8, 17.7, 0.4, 0.3) });
  const ct = clockAt(t); if (clock._t !== ct) { clock._t = ct; clock.textContent = ct; }

  // ----- left -----
  S(hL, { x: 480, y: 120, o: 1 });
  let flashing = [];
  tiles.forEach((el, i) => {
    const a = 3.0 + i * 0.06, p = E.back(prog(t, a, a + 0.4));
    const flash = t > 3.6 && t < DAY1 && Math.sin(t * 1.9 + i * 2.3) > 0.45;
    if (flash) flashing.push(i);
    if (el._f !== flash) { el._f = flash; el.classList.toggle('flash', flash); el._s.textContent = flash ? '? proceed (y/n)' : '✻ thinking…'; }
    const jit = flash ? Math.sin(t * 50 + i) * 1.2 : 0;
    S(el, { x: GRID[i][0] + jit, y: GRID[i][1], s: 0.6 + 0.4 * p, o: clamp(p * 2) });
  });
  // cursor hops between tiles every 0.42s, always to a "needs you" one
  const hop = Math.floor((t - 3.6) / 0.42), hp = E.outQuint(clamp(((t - 3.6) % 0.42) / 0.28));
  const tgt = k => { const i = ((k * 7 + 3) % 10 + 10) % 10; return GRID[i]; };
  const [ax, ay] = tgt(hop - 1), [bx, by] = tgt(hop);
  S(cur, { x: lerp(ax, bx, hp) + 40, y: lerp(ay, by, hp) + 20, o: env(t, 3.6, DAY1, 0.2, 0.3) });
  swN.textContent = Math.max(0, Math.floor((t - 3.2) * 17.3));
  S(talL, { x: 70, y: 975, o: 1 }); talL.style.transformOrigin = 'left';
  talL.style.transform = `translate(70px, 975px) translateY(-50%)`;
  chkL.forEach((c, i) => { const p = E.back(prog(t, SHIP_L[i], SHIP_L[i] + 0.35)); c.style.transform = `scale(${p})`; c.style.opacity = clamp(p * 2); });
  S(metaL, { x: 480, y: 1040, o: 1 });

  // ----- right -----
  S(hR, { x: 1440, y: 120, o: 1 });
  let k = -1; LIFE_T.forEach((a, i) => { if (t >= a) k = i; });
  chips.forEach((c, i) => { const a = LIFE_T[i], b = i < 4 ? LIFE_T[i + 1] : 17.6, o = env(t, a, b, 0.3, 0.25); S(c, { x: PHX, y: 250 + (1 - o) * 16, s: 1.1, o }); });
  const amp = VOICE.reduce((m, v) => Math.max(m, env(t, v, v + 0.7, 0.15, 0.2)), 0);
  S(ph, { x: PHX, y: PHY + 70, s: 0.7 });
  phoneState(ph, t, { time: ct.replace(/am|pm/, ''), amp });
  S(rg, { x: RX, y: RY + 60, s: 0.8 });
  const busy = SHIP_R.some((s, i) => t > VOICE[i] + 0.8 && t < s);
  ringState(rg, t * 150, SHIP_R.reduce((f, s, i) => (t > VOICE[i] + 0.8 && t < s + 0.2 ? Math.max(f, E.inOut(prog(t, VOICE[i] + 0.8, s))) : f), 0));
  S(rLab, { x: RX, y: RY + 250, o: 1 });
  minis.forEach((m, i) => {
    const v = VOICE[i], f = E.inOut(prog(t, v + 0.55, v + 1.05));
    const x = lerp(PHX + 30, RX, f), y = lerp(PHY + 20, RY + 60, f) - Math.sin(f * Math.PI) * 120;
    S(m, { x, y, s: lerp(0.8, 0.5, f), o: t > v + 0.5 && f < 1 ? clamp(prog(t, v + 0.5, v + 0.6) * 1) * (1 - prog(f, 0.85, 1)) : 0 });
  });
  talR.style.transform = `translate(1030px, 975px) translateY(-50%)`;
  chkR.forEach((c, i) => { const p = E.back(prog(t, SHIP_R[i], SHIP_R[i] + 0.35)); c.style.transform = `scale(${p})`; c.style.opacity = clamp(p * 2); });
  S(metaR, { x: 1440, y: 1040, o: 1 });

  // ----- end -----
  showCap(e2, t, 18.3, 30, 960, 440, { stagger: 0.12, dy: 60 });
  const lgIn = E.outQuint(prog(t, 19.8, 20.5));
  S(lg, { x: 960, y: 770, o: lgIn > 0 ? 1 : 0 }); M.logoIn(lg, prog(t, 19.8, 21.0));
  S(url, { x: 960, y: 870 + (1 - lgIn) * 20, o: E.outQuint(prog(t, 20.1, 20.7)) });
}
M.play({ duration: 23.5, render });
</script>
</body>
</html>
